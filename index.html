<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert Word .docx and PDF files to Markdown in your browser. Nothing is uploaded.">
  <title>docx / pdf → markdown</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #faf9f7;
      --fg: #1c1b19;
      --muted: #6b6862;
      --line: #dcd8d0;
      --card: #ffffff;
      --accent: #2867d6;
      --accent-soft: #edf3fd;
      --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #eeece6;
        --muted: #a4a099;
        --line: #35332f;
        --card: #1c1b19;
        --accent: #8ab4ff;
        --accent-soft: #1c2940;
        --danger: #f2b8b5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: clamp(28px, 7vw, 76px) 20px 32px;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -0.035em;
    }
    h1 span { color: var(--muted); font-weight: 400; }
    .lede { margin: 0 0 2rem; color: var(--muted); }
    .drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 2.7rem 1.5rem;
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      background: var(--card);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .drop:hover, .drop:focus-visible, .drop.over {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }
    .drop strong { font-size: 1.02rem; font-weight: 600; }
    .drop span { color: var(--muted); font-size: 0.92rem; }
    .drop.busy { opacity: 0.55; pointer-events: none; }
    .drop input { display: none; }
    #status {
      min-height: 1.5em;
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #status.error { color: var(--danger); }
    #result { margin-top: 1.6rem; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }
    #summary {
      color: var(--muted);
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; gap: 0.5rem; }
    button, .actions a {
      padding: 0.48rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
      font: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
    }
    .actions a {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    button:hover, .actions a:hover { filter: brightness(1.06); }
    button:focus-visible, .actions a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    #preview {
      max-height: 62vh;
      margin: 0;
      padding: 1rem;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    footer {
      margin-top: 2.6rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .actions a { color: #0d1117; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>docx <span>&amp;</span> pdf <span>→</span> markdown</h1>
      <p class="lede">Drop a Word or PDF file, get Markdown. Converted locally — nothing is uploaded.</p>
    </header>

    <label class="drop" id="drop" for="file" tabindex="0" role="button" aria-label="Choose or drop a .docx or .pdf file">
      <input id="file" type="file" accept=".docx,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf">
      <strong>Choose a .docx or .pdf file</strong>
      <span>or drag &amp; drop it here</span>
    </label>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="result" hidden>
      <div class="meta">
        <span id="summary"></span>
        <div class="actions">
          <button id="copy" type="button">Copy</button>
          <a id="download" download>Download .md</a>
        </div>
      </div>
      <pre id="preview" tabindex="0"></pre>
    </section>

    <footer>No upload, no dependencies, no tracking. Works offline once loaded.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
